baseline_id: BASELINE_V1
feature_set_id: BASELINE_FEATURES_V1
spec_version: "2.2"
status: FROZEN_G7
seed: 20260927

input:
  sample_rate_hz: 250
  window_samples: 2500
  representation: PREPROC_V1_CAUSAL_FILTERED_UNNORMALIZED_FLOAT64
  allowed_partitions: [TRAIN, VALIDATION]
  fit_partition: TRAIN
  reporting_partition: VALIDATION
  forbidden_partitions: [CALIBRATION, INTERNAL_TEST]
  forbidden_datasets: [INCART, NSTDB, BIDMC, WEARABLE_SIM_V1]

features:
  feature_selection: NONE
  source: ECG_WAVEFORM_ONLY
  annotation_derived_features: false
  quality_as_feature: false
  detector:
    detector_id: SCIPY_FIND_PEAKS_ABS_MEDIAN_V1
    package: scipy
    function: scipy.signal.find_peaks
    polarity_handling: ABSOLUTE_MEDIAN_CENTERED
    distance_samples: 50
    prominence_method: THREE_TIMES_WINDOW_MAD
    prominence_factor: 3.0
    prominence_numerical_floor: 1.0e-12
    width_rel_height: 0.5
    local_half_width_samples: 13
    role: BASELINE_FEATURE_ENGINEERING_ONLY

imputer:
  implementation: sklearn.impute.SimpleImputer
  strategy: median
  keep_empty_features: true
  fit_partition: TRAIN

scaler:
  implementation: sklearn.preprocessing.StandardScaler
  with_mean: true
  with_std: true
  fit_partition: TRAIN
  consumer: LOGISTIC_BASELINE_V1

majority:
  model_id: MAJORITY_BASELINE_V1
  source_partition: TRAIN
  tie_class: 0

logistic_regression:
  model_id: LOGISTIC_BASELINE_V1
  penalty: l2
  sklearn_1_9_parameterization: l1_ratio=0.0
  l1_ratio: 0.0
  C: 1.0
  solver: liblinear
  max_iter: 1000
  tol: 1.0e-4
  fit_intercept: true
  class_weight: null
  random_state: 20260927

random_forest:
  model_id: RF_BASELINE_V1
  n_estimators: 200
  criterion: gini
  max_depth: 12
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: sqrt
  bootstrap: true
  class_weight: null
  random_state: 20260927
  n_jobs: 1

reporting:
  decision_threshold: 0.5
  threshold_policy: FIXED_NOT_TUNED
  metrics:
    - pooled_window_auprc
    - pooled_window_auroc
    - patient_macro_f1
    - pooled_f1
    - precision
    - sensitivity
    - specificity
    - accuracy
  confidence_intervals: NONE_T018

claim_boundary: PIPELINE_SANITY_BASELINES_NOT_CLINICAL_MODELS
