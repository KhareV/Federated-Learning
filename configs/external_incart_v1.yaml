evaluation_id: EXTERNAL_INCART_V1
spec_version: "2.2"
status: METHOD_FROZEN_BEFORE_EXTERNAL_ACCESS

dataset:
  id: INCART
  official_name: St Petersburg INCART 12-lead Arrhythmia Database
  version: 1.0.0
  role: ONE_LOCKED_EXTERNAL_EVALUATION
  expected_records: 75
  expected_source_patients: 32

signal:
  required_lead_name: II
  lead_policy_id: INCART_EXACT_II_V1
  fallback: NONE
  source_rate_hz: 257
  target_rate_hz: 250
  resampler_id: INCART_257_TO_250_V1
  preproc_id: PREPROC_V1

target:
  target_id: AAMI_SVF_WINDOW_V1
  map_id: AAMI_SVF_MAP_V1
  window_seconds: 10
  window_samples: 2500
  stride_seconds: 5
  stride_samples: 1250
  prediction_timestamp: RIGHT_EDGE
  annotation_interval: CLOSED_SOURCE_TIME_T_MINUS_10S_TO_T
  minimum_mappable_beats: 5
  unusable_quality_excluded: true
  degraded_quality_eligible: true

model:
  model_id: MODEL_V1
  checkpoint: checkpoints/MODEL_V1.pt
  mode: eval
  device: cpu
  batch_size: 64
  gradient_mode: inference_mode
  augmentation: NONE
  batchnorm_adaptation: false

calibration:
  calibration_id: CAL_V1
  calibration_domain: MIT-BIH-v1.0.0
  transfer_semantics: MITBIH_SOURCE_DOMAIN_CALIBRATION_TRANSFERRED_UNCHANGED
  incart_calibration_claim: false
  temperature_source: artifacts/CAL_V1.json
  threshold_source: artifacts/CAL_V1.json
  threshold_comparator: ">="

metrics:
  continuous_probability: source_domain_calibrated_probability
  names: [AUPRC, AUROC, pooled_F1, precision, sensitivity, specificity, patient_macro_F1]
  zero_division: 0
  patient_macro_weighting: EQUAL_PATIENT_WEIGHT
  patient_macro_auprc: FORBIDDEN

bootstrap:
  method_id: PATIENT_CLUSTER_PERCENTILE_95_V1
  unit: participant_group_id
  replicates: 2000
  seed: 20260927
  rng: numpy.random.Generator
  bit_generator: PCG64
  confidence_level: 0.95
  interval: percentile
  lower_quantile: 0.025
  upper_quantile: 0.975
  quantile_method: linear
  resample_with_replacement: true
  preserve_cluster_multiplicity: true
  redraw_degenerate_replicates: false
  window_bootstrap: false
  record_bootstrap: false

one_shot: true
adaptation: false
prohibitions:
  training: true
  fine_tuning: true
  batchnorm_adaptation: true
  normalization_fit: true
  calibration_fit: true
  threshold_search: true
  lead_search: true
  map_change: true
  preprocessing_change: true
  alternate_seed_evaluation: true

claim_boundary: >-
  Cross-dataset performance of frozen MODEL_V1 on INCART exact Lead II under the locked
  map, target, preprocessing, calibration-transfer, and threshold procedure; not wearable,
  clinical, medical-device, population-wide, or 12-lead diagnostic evidence.
