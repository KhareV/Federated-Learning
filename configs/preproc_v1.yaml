  The canonical reusable cache retains causally resampled and filtered float64 ECG before
  model-specific per-window normalization. Any change to the resampler design,
  filter design/coefficients,
  gap thresholds/fill policy, group-delay convention, timestamp mapping, or state
  initialization after this point requires rerunning the affected T011/T012 evidence and,
