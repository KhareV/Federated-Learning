  secondary: MINIMIZE_WINDOW_FRACTION_DEVIATION
feature_noise_config: configs/fl_feature_noise_v1.yaml
training:
  clients: 8
  clients_per_round: 8
  rounds: 50
  local_epochs: 1
  batch_size: 64
  drop_last: false
