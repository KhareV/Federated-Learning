evaluation: {partition: VALIDATION, probability: sigmoid(raw_logit), calibration: NONE, metric_threshold_id: FL_METRIC_THRESHOLD_V1, metric_threshold: 0.5, metric_comparator: ">="}
checkpoint: {metric: validation_AUPRC, eligible_rounds: "1-50", tie_policy: EARLIEST_EXACT_MAXIMUM}
access:
  TRAIN: TRAINING_ONLY
  VALIDATION: SERVER_DEVELOPMENT_EVALUATION_ONLY
  NSTDB: PURE_NOISE_TRAINING_RESOURCE_ONLY
