config_id: FL_NON_IID_V1
task_id: T026
conditions:
  - FL_LABEL_SKEW_V1
  - FL_QUANTITY_SKEW_V1
  - FL_FEATURE_NOISE_V1
  - FL_COMBINED_SKEW_V1
reference: FL_IID_V1
model: {architecture_id: MODEL_V1_ARCHITECTURE_V1, centralized_checkpoint_warm_start: false}
initialization: {id: FL_INIT_V1, source: FRESH_MODEL_V1_ARCHITECTURE, seed: 20260927}
shuffle_seed_namespace: FL_IID_V1
manifests:
  label: NONIID_LABEL_V1
  quantity: NONIID_QUANTITY_V1
  feature: NONIID_FEATURE_V1
  combined: NONIID_COMBINED_V1
label_skew:
  capacities: [4, 4, 4, 3, 3, 3, 3, 3]
  primary: MAXIMIZE_LABEL_VARIANCE_OBJECTIVE_V1
  secondary: MINIMIZE_IID_SITE_WINDOW_DEVIATION
quantity_skew:
  source_ratio: [1, 1, 1, 2, 2, 3, 3, 4]
  integer_allocation: [2, 2, 2, 3, 3, 4, 5, 6]
  primary: MINIMIZE_LABEL_DIVERGENCE
  secondary: MINIMIZE_WINDOW_FRACTION_DEVIATION
combined_skew:
  integer_allocation: [2, 2, 2, 3, 3, 4, 5, 6]
