protocol_id: MODEL_V2_RESEARCH_PROTOCOL_V3
lineage: MODEL_V2
owner_task: C-V2-PRE006-AUTHORITY-REPAIR
status: FROZEN_RESEARCH_PROTOCOL
spec_version: '2.2'
canonical_task_sequence_unaffected: true
no_new_canonical_freeze_registry_row: true
fixed_scientific_constants:
  target_id: AAMI_SVF_WINDOW_V1
  map_id: AAMI_SVF_MAP_V1
  split_id: MITDB_SPLIT_V1
  source_lead: MLII
  sampling_hz: 250
  window_seconds: 10
  window_samples: 2500
  stride_seconds: 5
  stride_samples: 1250
  preproc_id: PREPROC_V1
  model_input_normalization_id: PER_WINDOW_ZSCORE_V1
  model_input_normalization_epsilon: 1.0e-08
  eligibility_exclusion_policy: UNCHANGED_FROM_FROZEN_V1
  quality_gap_policy: UNCHANGED_FROM_FROZEN_V1
  preproc_v2_in_first_lineage: false
model_seeds:
  seeds:
  - 20260927
  - 20260928
  - 20260929
  role: MATCHED_ROBUSTNESS_SEEDS
  release_seed_fixed_regardless_of_score: 20260927
primary_metrics:
