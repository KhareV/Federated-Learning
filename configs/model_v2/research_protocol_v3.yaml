  runs_after_winning_family_determined_only: true
  control:
    schedule: V1_EXISTING_SCHEDULE
  challenger:
    optimizer: AdamW
    learning_rate: 0.001
    weight_decay: SAME_AS_CONTROL
    scheduler: ReduceLROnPlateau
    scheduler_mode: max
    scheduler_factor: 0.3
    scheduler_patience: 3
    monitor: inner_validation_AUPRC
    early_stop_patience: 8
  comparisons_allowed: 1
  grid_search_forbidden: true
  adoption_rule: mean TRAIN-CV AUPRC improvement exceeds one bootstrap SE AND seed SD does not materially
    worsen
official_validation:
  max_frozen_configurations: 2
  training_population: ALL_27_TRAIN_PATIENT_GROUPS
  seeds:
  - 20260927
  - 20260928
  - 20260929
  change_freeze_on_first_access: true
  architecture_selection_rule: HIGHEST_MEAN_THREE_SEED_VALIDATION_AUPRC
  tie_rule: WITHIN_ONE_BOOTSTRAP_SE_PREFER_LOWER_VARIANCE_SIMPLER_MODEL
  release_checkpoint_seed: 20260927
  release_checkpoint_seed_fixed_regardless_of_score: true
  promotion_requirement:
    three_seed_confirmation_required: true
    superseded_v1_rule:
      release_seed_validation_auprc_min: 0.5628607838787021
      computation: 0.5328607838787021 (V1 release AUPRC) + 0.03
      note: 'V1''s hard D5 gate. Superseded below. The classical LR/RF historical VALIDATION AUPRC values
        (0.645879, 0.799672) were marked interpretation-benchmarks-only in V1 (hard_promotion_gates: false);
        V2 makes the LR-derived 0.646 value the actual hard gate threshold.'
    mean_three_seed_validation_auprc_min: 0.646
    mean_three_seed_validation_auprc_min_derivation: frozen historical LOGISTIC_BASELINE_V1 VALIDATION
      AUPRC (0.645879), rounded
    paired_patient_cluster_bootstrap_delta_auprc_vs_model_v1_lower_95_ci_bound_min: 0.0
    paired_comparison_rule_reused_from: patient_cluster_bootstrap (unchanged)
    superseded_v2_auroc_rule:
      auroc_material_regression_forbidden: true
      note: 'V2 carried this forward unchanged from V1 as an active hard D5 promotion gate. Superseded
        below: AUROC remains reported but is not an additional hard D5/D6 promotion criterion. The two
        hard criteria are the mean-three-seed-AUPRC and paired-bootstrap-CI rules, both unchanged. The
        separate runtime-acceptance/INCART AUROC guardrail (runtime_acceptance_guardrails) is unchanged
        and remains distinct from scientific promotion.'
    auroc_material_regression_forbidden: false
    auroc_role: SECONDARY_DIAGNOSTIC_REPORTED_NOT_A_D5_HARD_GATE
  frozen_classical_references_are_interpretation_benchmarks_only:
    LR_AUPRC: 0.645879
    RF_AUPRC: 0.799672
    hard_promotion_gates: PARTIAL -- LR_AUPRC (rounded to 0.646) is now the hard mean-three-seed-VALIDATION-AUPRC
      gate; RF_AUPRC remains interpretation-only
  superseded_v2_checkpoint_selection_rule:
    early_stopping_checkpoint_selection: OFFICIAL_VALIDATION_LOCKED_V2.2_ROLE
    note: V2 carried this value forward unchanged from V1 (byte-identical field), which assigned early-stopping/checkpoint-selection
      to official VALIDATION itself for the V2-007 finalists (V1 doc Section K's explicit prose). Superseded
      below.
  early_stopping_checkpoint_selection: FINAL_TRAIN_INNER_VALIDATION_LOCKED_V3_ROLE
  official_validation_role: EVALUATION_AND_FINALIST_COMPARISON_ONLY_AFTER_CHECKPOINT_FIXED
calibration_policy:
  component_id: CAL_V2
  timing: STRICTLY_AFTER_MODEL_V2_FINAL_FROZEN
  method: single_positive_scalar_temperature
  fit_scope: CALIBRATION_PARTITION_ONLY
  objective: NLL_minimization
  probability_formula: p = sigmoid(logit / T_V2)
  threshold_rule: F1_MAXIMUM_ON_CALIBRATED_CALIBRATION_PROBABILITIES
  threshold_comparator: '>='
  threshold_tie_policy: SAME_AS_V1_DETERMINISTIC_RULE
  forbidden:
  - Platt_scaling
  - isotonic_regression
  - TRAIN_OOF_calibration
  - TRAIN_plus_VALIDATION_calibration
  - reuse_or_mutation_of_CAL_V1
  required_report_fields:
  - NLL_raw
  - NLL_calibrated
  - Brier_raw
  - Brier_calibrated
  - ECE
  - reliability_bins
  - patient_count
  - window_and_class_counts
  claim_boundary: MIT_BIH_SOURCE_DOMAIN_CALIBRATION_ONLY
post_freeze_second_look:
  timing: STRICTLY_AFTER_MODEL_V2_FINAL_AND_CAL_V2_FROZEN
  domains:
    INTERNAL_TEST:
      passes: 1
      population: SAME_ELIGIBLE_POPULATION
      compare_to: FROZEN_V1_PREDICTIONS
      v1_rerun_forbidden: true
    INCART:
      passes: 1
      population: SAME_CLUSTERS_WINDOWS
      recalibration_forbidden: true
      lead_change_forbidden: true
      map_change_forbidden: true
    NSTDB:
      protocol: SAME_FROZEN_T019_STRESS_PROTOCOL
      population: SAME_PAIRED_WINDOWS
      snrs: SAME
      retuning_forbidden: true
  evidence_label: POST-FREEZE COMPARATIVE SECOND-LOOK EVIDENCE ON PREVIOUSLY EXPOSED EVALUATION DOMAINS
  untouched_v2_validation_claim_forbidden: true
runtime_acceptance_guardrails:
  note: Scientific MODEL_V2_FINAL and operational runtime acceptance are different decisions. MODEL_V2_FINAL
    cannot be retuned after second-look exposure.
  INCART:
    min_point_delta_auprc: -0.03
    min_point_delta_auroc: -0.03
  INTERNAL_TEST:
    min_point_delta_auprc: -0.05
    min_point_delta_auroc: -0.05
  NSTDB:
    min_single_snr_delta_auprc: -0.1
    min_mean_six_snr_delta_auprc: -0.05
  report_paired_confidence_intervals: true
  these_are_guardrails_not_tuning_objectives: true
  on_failure: MODEL_V2_FINAL remains a frozen research result; MODEL_V1 remains the operational runtime
    lineage.
downstream_impact:
  if_runtime_accepted_may_create:
  - CAL_V2
  - GATEWAY_ARTIFACT_V2
  - EXPLAINABILITY_V2
  - API_RUNTIME_V2
  - V2_alert_calibration_binding
  - V2_replay_evidence
  must_not_mutate:
  - GATEWAY_ARTIFACT_V1
  - EXPLAINABILITY_V1
  - API_RUNTIME_V1_1
  - ALERT_POLICY_V1
  - V1_replay
  frontend_versioning_rule: Inspect later whether the frontend is already model-ID-generic; do not version
    the frontend solely because V2 exists.
  federated_model_v2_experiments_in_first_lineage: false
change_control:
  protocol_mutation_after_freeze: Any change requires a new MODEL_V2_RESEARCH_PROTOCOL_V2 successor; this
    lock is never mutated in place.
parent_protocol: MODEL_V2_RESEARCH_PROTOCOL_V2
change_reason: 'Pre-V2-006 correction of implementation drift relative to the self-contained MODEL_V2
  authority contract supplied in the C-V2-PRE006-AUTHORITY-REPAIR checkpoint prompt: (1) official VALIDATION
  must never govern early stopping, scheduler decisions, or checkpoint selection for the V2-007 finalists
  -- V2 had carried forward V1''s OFFICIAL_VALIDATION_LOCKED_V2.2_ROLE value unchanged, which assigned
  exactly that role to official VALIDATION; V3 replaces it with a dedicated TRAIN-only final inner-validation
  split (MITDB_TRAIN_FINAL_INNER_V2_V1). (2) AUROC is a reported secondary diagnostic at D5, not an additional
  hard promotion gate -- V2 had carried forward V1''s auroc_material_regression_forbidden=true hard gate
  unchanged; V3 supersedes it, leaving the two hard AUPRC criteria unchanged. (3) The MODEL_V2 D0-D5 neural-fit
  search ceiling is explicitly 90, not the 100 figure used as an unauthoritative control-plane convention
  in prior V2-002..V2-005 evidence. No historical fit count, architecture result, or hybrid disposition
  changes.'
final_train_role_split:
  component_id: MITDB_TRAIN_FINAL_INNER_V2_V1
  historical_outer_cv_inner_manifest_unchanged: MITDB_TRAIN_INNER_V2_V1
  population: ALL_27_TRAIN_PATIENT_GROUPS
  roles:
  - OPTIMISE
  - FINAL_INNER_VALIDATION
  expected_optimise_count_approx: 22
  expected_final_inner_validation_count_approx: 5
  optimise_controls:
  - gradient_updates
  - pos_weight
  - train_augmentation
  final_inner_validation_controls:
  - scheduler_metric
  - early_stopping_metric
  - checkpoint_selection_metric
  official_validation_forbidden_roles:
  - gradient_updates
  - pos_weight
  - scheduler
  - early_stopping
  - checkpoint_selection
  - architecture_modification
  - hyperparameter_tuning
  pos_weight_formula: negative_OPTIMISE_windows / positive_OPTIMISE_windows
  v1_comparison_asymmetry_note: Historical MODEL_V1 used official VALIDATION for early stopping/checkpoint
    selection (carried forward unchanged into V1/V2's early_stopping_checkpoint_selection field). MODEL_V2
    V2-007 finalist training deliberately uses MITDB_TRAIN_FINAL_INNER_V2_V1 instead -- a documented,
    deliberate methodological difference. V1 is never retroactively retrained or 'fixed' because of this
    difference; the V2-vs-V1 official-validation comparison carries this known asymmetry.
search_budget:
  d0_d5_max_neural_fits: 90
  v2_006_local_max_new_fits: 15
  v2_007_max_new_fits: 6
  completed_neural_fits_before_v2_006: 50
  max_cumulative_after_v2_006: 65
  max_cumulative_through_v2_007: 71
  cap_is_search_control_ceiling_not_performance_target: true
  superseded_fields:
    prior_evidence_denominator: 100
    note: 'V2-002/V2-003/V2-004/V2-005 evidence (search_budget.json files) reported a 100-fit denominator
      that was never actually defined as an authoritative field in Protocol V1 or V2 -- an unauthoritative
      control-plane reporting convention. V3 establishes the authoritative MODEL_V2 D0-D5 ceiling of 90.
      This does not change any historical fit count: completed fits remain 50 (V2-002=15, V2-004=35, V2-005=0);
      no prior zero-fit decision is invalidated; historical evidence text is not rewritten.'
cal_v2_ordering:
  chronology:
  - MODEL_V2_official_validation
  - MODEL_V2_FINAL_freeze
  - CAL_V2_fit_freeze
  - post_freeze_second_look_INTERNAL_TEST_INCART_NSTDB
  - runtime_acceptance_decision
  - gateway_api_frontend_integration_only_if_accepted
  cal_v2_contingent_on_runtime_acceptance: false
  governing_fields:
  - calibration_policy.timing
  - post_freeze_second_look.timing
model_v2_final_vs_runtime_acceptance:
  model_v2_final: SCIENTIFICALLY_SELECTED_AND_FROZEN_AFTER_OFFICIAL_VALIDATION
  model_v2_runtime_accepted: DETERMINED_LATER_AFTER_POST_FREEZE_SECOND_LOOK
  frozen_v2_may_remain_non_operational_if_guardrails_fail: true
  model_v1_remains_operational_if_v2_not_runtime_accepted: true
