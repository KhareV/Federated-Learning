  bootstrap_seed_value: 20261002
  sampling_unit: participant_group_id
  sampling_with_replacement: true
  preserves_window_multiplicity: true
  recompute_pooled_metric_per_replicate: true
  paired_comparison_rule: SAME_SAMPLED_PATIENT_IDS_BOTH_MODELS
  multi_seed_paired_rule: PAIRED_DELTA_PER_SEED_THEN_AVERAGE_SEED_DELTAS_PER_REPLICATE
  window_bootstrap_forbidden: true
architectures:
  ARCH_A:
    component_id: MODEL_V2_CAPCTRL
    purpose: capacity_only_control
    layers:
    - op: Conv1d
      in_channels: 1
      out_channels: 32
      kernel_size: 7
    - op: BatchNorm1d
    - op: ReLU
    - op: MaxPool1d
      kernel_size: 2
    - op: Conv1d
      in_channels: 32
      out_channels: 64
      kernel_size: 5
    - op: BatchNorm1d
    - op: ReLU
    - op: MaxPool1d
      kernel_size: 2
    - op: Conv1d
      in_channels: 64
      out_channels: 128
      kernel_size: 5
    - op: ReLU
    - op: AdaptiveAvgPool1d
      output_size: 1
    - op: Flatten
    - op: Dropout
      p: 0.2
    - op: Linear
      in_features: 128
      out_features: 1
    output_is_raw_logit: true
    sigmoid_in_model: false
    expected_trainable_parameters_approx: 51969
    parameter_count_verification: MECHANICAL_LATER
    receptive_field_semantics: SHORT_V1_LIKE
  ARCH_B:
    component_id: MODEL_V2_TCN_MEAN
    stem:
      op: Conv1d
      in_channels: 1
      out_channels: 24
      kernel_size: 15
      stride: 2
      padding: 7
      bias: false
    stem_followed_by:
    - BatchNorm1d_24
    - ReLU
    residual_blocks: 7
    channels: 24
    kernel_size: 7
    dilations:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
    residual_block_structure:
    - op: Conv1d
      channels: 24
      kernel_size: 7
      dilation: d
      padding: 3*d
      bias: false
    - op: BatchNorm1d
    - op: ReLU
    - op: Dropout
      p: 0.1
    - op: Conv1d
      channels: 24
      kernel_size: 7
      dilation: d
      padding: 3*d
      bias: false
    - op: BatchNorm1d
    - op: ResidualAdd
    - op: ReLU
    head:
      pooling: global_temporal_mean
      dropout: 0.2
      linear:
        in_features: 24
        out_features: 1
    output_is_raw_logit: true
    sigmoid_in_model: false
    expected_analytic_receptive_field_samples: 3063
    receptive_field_requirement: '>=2500'
    expected_parameter_count_approx: 58000
    parameter_count_hard_cap: 120000
  ARCH_C:
    component_id: MODEL_V2_TCN_MEANMAX
    identical_to: ARCH_B
    identical_through: final_temporal_feature_map
    pooling: concat(global_mean(features,time), global_max(features,time))
    head:
      dropout: 0.2
      linear:
        in_features: 48
        out_features: 1
    output_is_raw_logit: true
    sigmoid_in_model: false
    isolates: sparse_event_pooling
  forbidden_in_first_lineage:
  - transformer
  - LSTM
  - GRU
  - spectrogram
  - wavelet_model
  - self_supervised_pretraining
  - attention_pooling
  - new_window_size
  - new_target
  - new_patient_split
  - new_lead
  - preproc_change
  - model_ensemble
architecture_search_policy:
  v1_cv_reference_fits:
    folds: 5
    seeds: 3
    total: 15
  candidate_ranking: pooled_OOF_AUPRC_within_each_stage
  practical_improvement_rule_min_delta_auprc: 0.02
  auroc_guardrail_min_delta: -0.01
  report_paired_patient_cluster_bootstrap_ci: true
  unrealistically_narrow_ci_requirement_forbidden: true
  max_eligible_candidate_families_continuing: 2
  within_one_bootstrap_se_tiebreak: prefer_simpler_lower_variance
  hybrid_runs_only_if_feature_information_trigger_satisfied: true
  superseded_v1_fields:
    all_primary_comparisons_use_all_three_seeds: true
    elimination_after_single_seed_forbidden: true
    primary_experiment_fits:
      architectures: 3
      folds: 5
      seeds: 3
      total: 45
    note: These V1 fields required all three architectures to receive all three seeds before any elimination
      (45 fits, no staging). Superseded by stage_D1/stage_D2 below. V1 itself is unmodified; this block
      documents what changed and why.
  stage_D1:
    architectures:
    - MODEL_V2_CAPCTRL
    - MODEL_V2_TCN_MEAN
    - MODEL_V2_TCN_MEANMAX
    seed: 20260927
    folds: 5
    total_fits: 15
    disqualification_rules:
    - non_finite_candidate
    - pooled_OOF_AUROC_below_frozen_V1_CV_reference_mean_AUROC
    - trainable_parameters_above_120000
    ranking: pooled_OOF_AUPRC
    advancement_rule: paired_patient_cluster_bootstrap_delta_AUPRC_vs_MODEL_V1_CV_REFERENCE_V1_lower_95_CI_bound_greater_than_0
    max_advancing: 2
    tie_rule: within_one_bootstrap_se_prefer_simpler_lower_variance
    zero_candidates_advance_policy: STOP_NEURAL_ARCHITECTURE_SEARCH_PER_PROTOCOL -- do not manufacture
      D2 fits, do not access official VALIDATION
  stage_D2:
    architectures: at most 2, exactly the D1-advanced set
    seeds:
    - 20260928
    - 20260929
    folds: 5
    max_additional_fits: 20
  maximum_v2_004_fits: 35
