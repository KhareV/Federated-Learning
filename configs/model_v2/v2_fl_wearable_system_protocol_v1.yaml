arrival_schedule:
  round_1: canonical client order
  round_2: reverse client order
  round_3: "INJECT stale (envelope claiming round 2), then first valid update, INJECT duplicate of that accepted update, INJECT wrong-base-state, INJECT unknown client, then the remaining seven valid updates (a duplicate necessarily follows one accepted update)"
  injected_envelopes_are_derived_from_valid_round_3_envelopes_by_field_mutation: true
aggregation_canonicalization: "accepted updates are sorted by client ID before aggregation; every arrival sequence maps to that canonical order; invariance proven for canonical, reverse and one fixed permutation"
commit_rule: "commit only with 8 unique authorized accepted clients; a second commit of a round fails ROUND_ALREADY_COMMITTED; no partial aggregation"
restart_resume: "continuous run vs rounds 1-2 -> persist {protocol id, experiment id, cohort manifest sha, round, committed hashes, state artifact} -> terminate -> fresh process resumes round 3; final SHA must equal continuous; resume artifact is engineering-only, deleted after verification, hashes recorded"
