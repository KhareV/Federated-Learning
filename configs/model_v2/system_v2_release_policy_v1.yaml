  performance_independent: true
  pass_criteria: [release policy frozen before default change, decision evaluator reads frozen evidence only, all hard blockers pass, historical scientific non-promotion preserved, release decision explicit, MODEL_V2_FINAL becomes default only after ACCEPT, FL checkpoint not deployed, CAL_V2/GATEWAY_V2 binding exact, API_SCHEMA_V1 unchanged, no public model selector, V1 rollback preserved, mixed bindings fail closed, frontend reflects V2 identities, V2 replay succeeds through the default launch path, V1 rollback replay succeeds, clean release clone succeeds, known limitations present, no hardware/clinical claim, protected artifacts unchanged, full regression passes, repository clean and pushed]
