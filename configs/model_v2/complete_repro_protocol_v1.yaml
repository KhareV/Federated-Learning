clean_clone:
  method: "brand-new `git clone` of the configured remote into a newly created temporary root, then `git checkout --detach <method commit>`"
  forbidden: [git worktree, copied directory, tarball, filesystem snapshot, reused scratch clone, reused C035 clone, cp/rsync/symlink/bind-mount/scp of any source, data or dependency directory]
  isolated_environment: {HOME: fresh temp, PYTHONPATH: unset, NODE_PATH: unset, PYTHONNOUSERSITE: 1, inherited_virtualenv: none, parent_node_modules: none}
  clone_step_exception: "git clone itself runs with the ambient environment so the user's SSH identity can reach the remote; every later command runs under the isolated HOME"
  python: {version: "3.11", venv: "<clone>/.venv", install: ["pip install -r requirements-dev.lock", "pip install --no-deps -e .", "pip check"], rescue_install: forbidden}
  frontend: {install: "npm ci (frontend/)", checks: ["npm test", "npm run check", "npm run build"], npm_install: forbidden, copied_node_modules: forbidden}
  failure_rule: "Any hidden dependency, data dependency, missing artifact, failing test or mismatch STOPs the run. The clone is NEVER edited, repaired or rescue-installed: preserve the failure evidence, make a prospective repository correction, commit, discard the clone and create an entirely NEW clone."
  public_dataset_download: forbidden (not required by this proof)
  raw_dataset_copy: forbidden (T035/C035 lesson)
evidence_output: external directory outside the clone; imported only through scripts/import_v2_014_evidence.py after hash verification
