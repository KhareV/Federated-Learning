# FEDPROX_METHOD_V2 -- V2-FL-003 MODEL_V2 FedProx contract (additive; MODEL_V1 FedProx files untouched).
method_id: FEDPROX_METHOD_V2
task_id: V2-FL-003
gate: V2FLG2
roadmap_protocol: MODEL_V2_FL_PROTOCOL_V2
selection_semantics: FEDPROX_SELECTION_SEMANTICS_V1   # re-bound additively for MODEL_V2 (ids ..._V2)
objective: "BCEWithLogitsLoss + mu/2 * sum_trainable_parameters ||w - w_global||^2"
proximal_scope: trainable_parameters_only             # NOT running_mean / running_var / num_batches_tracked
w_global: round_start_global_trainable_parameters
mu_zero_role: IMPLEMENTATION_EQUIVALENCE_CONTROL_ONLY # never a selection candidate
mu_candidates: [0.001, 0.01, 0.1]                      # exact set and order; no adaptive search
tuning_condition: label                                # LABEL only
model: {architecture_id: MODEL_V2_TCN_MEAN, parameter_count: 57553, centralized_checkpoint_warm_start: false}
initialization: {id: FL_INIT_V2, seed: 20260927, round_0_state_sha256: 6a2923ca87793fb78571b4cffad4026f8b4ce99d9dfcb3abe885e259c68a572f, round_0_validation_AUPRC: 0.25769234928353735}
training: {clients: 8, clients_per_round: 8, rounds: 50, local_epochs: 1, batch_size: 64, shuffle: true, drop_last: false, num_workers: 0, device: cpu, augmentation: NONE}
optimizer: {implementation: AdamW, learning_rate: 0.001, weight_decay: 0.0001, state_policy: RESET_EACH_CLIENT_EACH_ROUND, scheduler: NONE, gradient_clipping: NONE}
loss: {base: BCEWithLogitsLoss, pos_weight: 1.7157717177396683, pos_weight_source: GLOBAL_TRAIN_NEG_OVER_POS, client_specific_weights: false}
aggregation: {id: SAMPLE_COUNT_WEIGHTED_MODEL_DELTA_V1, weight: num_examples_actually_used}
transport: {id: FL_STATE_TRANSPORT_V1}
shuffle_seed_namespace: FL_IID_V1
evaluation: {partition: VALIDATION, probability: sigmoid(raw_logit), calibration: NONE, metric_threshold: 0.5, metric_comparator: ">="}
checkpoint: {metric: validation_AUPRC, eligible_rounds: 1-50, tie_policy: EARLIEST_EXACT_MAXIMUM, also_save: round_50}
conditions:                     # transfer run order after FEDPROX_MU_V2 is frozen
  iid:      {manifest: CLIENTS_IID_V1,    path: CLIENTS_IID_V1.csv,    sha256: 80f38fa25c508f9b4e2a4fd49e29c4c8d0034443ec67f7c24bc0954912b6c32a, feature_noise: false, fedavg_result: reports/model_v2/v2_fl_001/fl_iid_model_v2_result.json}
  label:    {manifest: NONIID_LABEL_V1,   path: NONIID_LABEL_V1.csv,   sha256: 753368ca061149b79d8fc6a0fa0a09700d63c6deb9b252380d2d5fc769b88176, feature_noise: false, fedavg_result: reports/model_v2/v2_fl_002/label_result.json}
  quantity: {manifest: NONIID_QUANTITY_V1, path: NONIID_QUANTITY_V1.csv, sha256: 9e4897ad72ee93294abe1785746d82e478f9e032d73257a53c2074a3bf4bea7e, feature_noise: false, fedavg_result: reports/model_v2/v2_fl_002/quantity_result.json}
  feature:  {manifest: NONIID_FEATURE_V1, path: NONIID_FEATURE_V1.csv,  sha256: dfecfb01d2dc913f7576c18dcc0461b9c1cbb59ab5eb6061384871fc7b1f6291, feature_noise: true,  fedavg_result: reports/model_v2/v2_fl_002/feature_result.json}
  combined: {manifest: NONIID_COMBINED_V1, path: NONIID_COMBINED_V1.csv, sha256: c0d15625e9f95d923b056244585db2b395d43831fb2cd2ddd4bfdd287ee07f47, feature_noise: true,  fedavg_result: reports/model_v2/v2_fl_002/combined_result.json}
transfer_order: [iid, quantity, feature, combined]
label_fedavg_baseline:
  result: reports/model_v2/v2_fl_002/label_result.json
  best_round: 50
