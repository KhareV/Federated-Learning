  best_checkpoint_sha256: 524f50674dc907f6791c08e7339ee06e338bd6502f14ac8a7e601da52876be82
  round_1_state_sha256: 3f57e799f19a252a957061df7a5c36ee2002085e33569f370133ce09b170e71b
  VALIDATION_PATIENT_MACRO_AUPRC_V2: 0.7247232349533131
  VALIDATION_PATIENT_WORST_AUPRC_V2: 0.03809523809523809
guardrail:
  rule: candidate_worst_patient_AUPRC >= baseline_worst - 0.05
  absolute_degradation: 0.05
  threshold: -0.01190476190476191
  nonbinding_disclosure: "AUPRC >= 0 > threshold, so the guardrail can never exclude a valid candidate. Documented BEFORE results; not repaired; no tighter V2-specific guardrail is invented."
selection_rule:
  primary: highest VALIDATION_PATIENT_MACRO_AUPRC_V2 (compared at 12 decimals)
