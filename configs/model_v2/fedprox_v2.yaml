bootstrap: {B: 2000, seed: 20260927, method: PATIENT_CLUSTER_PERCENTILE_95_V1, role: DEVELOPMENT_DIAGNOSTIC_ONLY, not_a_pass_criterion: true}
access:
  TRAIN: TRAINING_ONLY
  VALIDATION: SERVER_DEVELOPMENT_EVALUATION_ONLY
  NSTDB: PURE_NOISE_TRAINING_RESOURCE_ONLY_FOR_FEATURE_COMBINED
