name: NHM fast lane

# Manual-only (workflow_dispatch), like t001.yml: automatic CI stays deferred by the owner's explicit instruction.
# To make this run on every push, add `push:` / `pull_request:` under `on:` ONLY when the owner asks for it.
# Scope: the frontend suite and type check, plus the backend tests that need no multi-GB raw data (governance chain, studio,
# candidate library, realistic cohort, hardware quality). The full suite is still run locally (hours).
# Not yet executed on GitHub: it mirrors the local commands, which pass locally.
on:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx svelte-check --threshold error

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Governance, studio, candidate library, realistic cohort, hardware quality
        env:
          PYTHONPATH: src:.
        run: python -m pytest tests -q -p no:cacheprovider -k "successor or governance or lock or studio or candidate or realistic or hardware_quality or preflight"
