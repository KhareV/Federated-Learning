name: T001

on:
  push:
  pull_request:

jobs:
  phase-01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify Python 3.11 runtime
        id: runtime
        run: |
          python --version
          python -c 'import platform, sys; assert sys.version_info[:2] == (3, 11); print(platform.python_version())'
          echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Install exact Phase-01 environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: make lint PYTHON=python
      - name: Pytest
        run: make test PYTHON=python
      - name: Smoke
        run: make smoke PYTHON=python
      - name: Generate evidence
        run: make evidence PYTHON=python
      - name: Publish runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ steps.runtime.outputs.version }}
          path: reports/t001/python_version.txt
          retention-days: 30
      - name: T002 coverage audit
        run: make coverage PYTHON=python
      - name: T002 evidence generation
        run: make t002-evidence PYTHON=python
