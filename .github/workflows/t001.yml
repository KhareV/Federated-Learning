name: NHM CI

# Automatic CI (push/pull_request triggers) was intentionally deferred from T004 through T032
# (see docs/HARDWARE_DEFERRED_EXECUTION_PLAN.md), then briefly restored at T033. As of T034,
# automatic CI is deferred again by EXPLICIT USER INSTRUCTION given in-chat: this workflow is
# manual-only (workflow_dispatch) until the user explicitly asks for CI to be re-enabled in a
# future conversation. The t033-backend/t033-frontend/phase-01 jobs below are unchanged and
# available on demand; see reports/t034/ci_deferral.json for the recorded policy, and
# reports/t033/ci_run.json / reports/t033/ci_report.json for the preserved historical T033 CI
# result (not rewritten by this change).
on:
  workflow_dispatch:

jobs:
  phase-01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify Python 3.11 runtime
        id: runtime
        run: |
          python --version
          python -c 'import platform, sys; assert sys.version_info[:2] == (3, 11); print(platform.python_version())'
          echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Install exact Phase-01 environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: make lint PYTHON=python
      - name: Pytest
        run: make test PYTHON=python
      - name: Smoke
        run: make smoke PYTHON=python
      - name: Generate evidence
        run: make evidence PYTHON=python
      - name: Publish runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ steps.runtime.outputs.version }}
          path: reports/t001/python_version.txt
          retention-days: 30
      - name: T002 coverage audit
        run: make coverage PYTHON=python
      - name: T002 evidence generation
        run: make t002-evidence PYTHON=python
      - name: T003 contract validation
        run: make contracts PYTHON=python
      - name: T003 evidence generation
        run: make t003-evidence PYTHON=python

  # T033: the first automatic-CI job. Scoped deliberately: data/raw (multi-GB PhysioNet
  # acquisitions) is never downloaded here, so this job runs only the T032/T033 test files and
  # frozen-artifact verifiers that are self-contained against git-tracked
  # checkpoints/artifacts/manifests -- not the repo's full pytest suite (which includes
  # dataset-dependent tests). T035 owns the full clean-environment reproducibility audit.
  t033-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact Phase-01 environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint (full repository)
        run: make lint PYTHON=python
      - name: T032 API contract/runtime tests
        run: |
          PYTHONPATH=src:. python -m pytest -v \
            tests/test_api_t032.py \
            tests/test_api_errors_t032.py \
            tests/test_api_stateful_t032.py \
            tests/test_api_openapi_t032.py \
            tests/test_api_scope_t032.py \
            tests/test_api_runtime_lock_t032.py \
            tests/test_api_tamper_matrix_t032.py \
            tests/test_api_schema_v1.py \
            tests/test_api_slice_t005.py
      - name: T033 dashboard-state tests
        run: |
          PYTHONPATH=src:. python -m pytest -v \
            tests/test_dashboard_states.py \
            tests/test_dashboard_lock_t033.py
      - name: API_RUNTIME_V1 verification
        run: PYTHONPATH=src:. python scripts/verify_api_runtime_t032.py
      - name: DASHBOARD_UI_V1 verification
        run: PYTHONPATH=src:. python scripts/verify_dashboard_ui_t033.py
      - name: pip check
        run: python -m pip check

  t033-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Production build
        run: npm run build
